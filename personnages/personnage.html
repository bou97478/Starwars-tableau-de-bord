<script>const ROOT = "../";</script>

<script src="../assets/js/render.js"></script>
<script>
(async () => {
  const data = await loadData();
  const id = qParam("id");
  const p = data.personnages.find(x => x.id === id);
  const wrap = document.getElementById("sheet-wrap");

  if (!p) {
    wrap.innerHTML = `<div class="dossier-head"><h1>Dossier introuvable</h1><p class="lead">Aucun personnage ne correspond à cet identifiant.</p></div>`;
  } else {
    const unite = data.unites.find(u => u.id === p.uniteId);
    const crumbs = [];
    if (unite) {
      crumbs.push({ label: "Rébellion de Minos", href: "../zones/rebellion-de-minos.html" });
      crumbs.push({ label: unite.nom, href: "../cellules/unite.html?id=" + encodeURIComponent(unite.id) });
    }
    crumbs.push({ label: p.nom });
    setBreadcrumb(document.getElementById("breadcrumb"), crumbs);

    renderCharacterSheet(wrap, p);

    document.title = p.nom + " — Dossier personnage";
  }
})();
</script>
</body>
