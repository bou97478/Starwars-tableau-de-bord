<script>const ROOT = "../";</script>
<script src="../assets/js/skills.js"></script>

<script src="../assets/js/render.js"></script>
<script>
(async () => {
  const data = await loadData();
  const id = qParam("id");
  const lieu = data.lieux.find(l => l.id === id);

  if (!lieu) {
    document.getElementById("dossier-head").innerHTML = `<h1>Lieu introuvable</h1><p class="lead">Aucun lieu ne correspond à cet identifiant.</p>`;
  } else {
    setBreadcrumb(document.getElementById("breadcrumb"), [
      { label: "Amas de Minos", href: "amas-de-minos.html" },
      { label: lieu.nom }
    ]);
    document.getElementById("dossier-head").innerHTML = `
      <div class="eyebrow">Fiche de lieu — Amas de Minos</div>
      <h1>${escapeHtml(lieu.nom)}</h1>
      <p class="lead">${escapeHtml(lieu.description) || "Aucune information confirmée pour ce système."}</p>
    `;
    renderLieuDetail(document.getElementById("lieu-detail"), lieu);
    const personnages = data.personnages.filter(p => p.lieuId === lieu.id);
    renderCharGrid(document.getElementById("char-grid"), personnages);
  }
})();
</script>
</body>
