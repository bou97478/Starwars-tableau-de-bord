<div class="wrap">
  <div class="dossier-head" id="dossier-head"></div>

  <div class="equip-filters" id="veh-filters" style="display:none;">
    <div class="field search">
      <label>Recherche</label>
      <input type="text" id="veh-search" placeholder="Nom du vaisseau/véhicule...">
    </div>
    <div class="field">
      <label>Catégorie</label>
      <select id="veh-categorie"><option value="">Toutes</option></select>
    </div>
    <div class="field" id="veh-soustype-field" style="display:none;">
      <label>Sous-type</label>
      <select id="veh-soustype"><option value="">Tous</option></select>
    </div>
  </div>

  <div class="section-title"><h2>Personnages</h2><div class="rule"></div></div>

</div>

<footer>ARCHIVES DE L'ALLIANCE — USAGE INTERNE UNIQUEMENT</footer>

<script>const ROOT = "../";</script>
<script src="../assets/js/skills.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/render.js"></script>
<script>
(async () => {
  const data = await loadData();
  const id = qParam("id");
  const unite = data.unites.find(u => u.id === id);

  if (!unite) {
    document.getElementById("dossier-head").innerHTML = `<h1>Unité introuvable</h1><p class="lead">Aucune unité ne correspond à cet identifiant.</p>`;
  } else {
    const org = data.organisations.find(o => o.id === unite.orgId);
    const orgIndexPages = { "rebellion-de-minos": "../zones/rebellion-de-minos.html" };
    const orgHref = orgIndexPages[unite.orgId] || "../index.html";
    const orgNom = org ? org.nom : "Réseau Minos";

    setBreadcrumb(document.getElementById("breadcrumb"), [
      { label: orgNom, href: orgHref },
      { label: unite.nom }
    ]);
    document.getElementById("dossier-head").innerHTML = `
      <div class="eyebrow">Fiche d'unité — ${escapeHtml(orgNom)}</div>
      <h1>${escapeHtml(unite.nom)}</h1>
      <p class="lead">${escapeHtml(unite.description) || "Aucune information confirmée pour cette unité."}</p>
    `;
    const personnages = data.personnages.filter(p => p.uniteId === unite.id);

    if (unite.id === "vaisseaux") {
      setupVehiculesFilters(personnages);
    } else {
      renderCharGrid(document.getElementById("char-grid"), personnages);
    }
  }
})();

function setupVehiculesFilters(personnages) {
  document.getElementById("veh-filters").style.display = "";
  document.getElementById("veh-count").style.display = "";

  // Catégorie = partie avant " — " de p.carriere ; sous-type = partie après, si présente.
  const splitCarriere = p => {
    const c = p.carriere || "Autre";
    const idx = c.indexOf(" — ");
    return idx === -1 ? [c, null] : [c.slice(0, idx), c.slice(idx + 3)];
  };

  const categories = [...new Set(personnages.map(p => splitCarriere(p)[0]))].sort((a, b) => a.localeCompare(b, "fr"));
  const selCat = document.getElementById("veh-categorie");
  categories.forEach(c => { selCat.innerHTML += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`; });

  const selSousType = document.getElementById("veh-soustype");
  const sousTypeField = document.getElementById("veh-soustype-field");

  function updateSousTypeOptions() {
    const cat = selCat.value;
    const sousTypes = [...new Set(
      personnages.filter(p => !cat || splitCarriere(p)[0] === cat)
        .map(p => splitCarriere(p)[1]).filter(Boolean)
    )].sort((a, b) => a.localeCompare(b, "fr"));
    if (!cat || !sousTypes.length) {
      sousTypeField.style.display = "none";
      selSousType.value = "";
      return;
    }
    sousTypeField.style.display = "";
    selSousType.innerHTML = `<option value="">Tous</option>` + sousTypes.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  }

  function render() {
    const q = document.getElementById("veh-search").value.trim().toLowerCase();
    const cat = selCat.value;
    const sousType = selSousType.value;
    const filtered = personnages.filter(p => {
      const [pc, ps] = splitCarriere(p);
      if (cat && pc !== cat) return false;
      if (sousType && ps !== sousType) return false;
      if (q && !p.nom.toLowerCase().includes(q)) return false;
      return true;
    });
    document.getElementById("veh-count").textContent =
      `${filtered.length} vaisseau${filtered.length > 1 ? "x" : ""}/véhicule${filtered.length > 1 ? "s" : ""} sur ${personnages.length}`;
    renderCharGrid(document.getElementById("char-grid"), filtered);
  }

  document.getElementById("veh-search").addEventListener("input", render);
  selCat.addEventListener("change", () => { updateSousTypeOptions(); render(); });
  selSousType.addEventListener("change", render);

  render();
}
</script>
</body>
</html>
